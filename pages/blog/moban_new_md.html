<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Markdown文章 - HealthJian的博客</title>
    
    <!-- 基础样式 -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dark-mode.css">
    <link rel="stylesheet" href="../../css/blog-post.css">
    <link rel="stylesheet" href="../../css/footer-enhanced.css">
    
    <!-- Markdown专用样式 -->
    <link rel="stylesheet" href="blogjs_markdown/markdown-styles.css">
    <link rel="stylesheet" href="../../css/leisure-markdown.css">
    
    <!-- 外部依赖 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-light.min.css" id="hljs-light">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css" id="hljs-dark" disabled>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Markdown解析库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/2.1.3/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    
    <!-- KaTeX数学公式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
    
    <!-- Mermaid 图表渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>

    <!-- 备用CDN -->
    <script>
        // 检查marked是否加载成功，如果失败则加载备用CDN
        if (typeof marked === 'undefined') {
            console.warn('主CDN加载失败，尝试备用CDN');
            document.write('<script src="https://unpkg.com/marked@2.1.3/marked.min.js"><\/script>');
        }
        
        // 检查hljs是否加载成功
        if (typeof hljs === 'undefined') {
            console.warn('highlight.js主CDN加载失败，尝试备用CDN');
            document.write('<script src="https://unpkg.com/@highlightjs/cdn-assets@11.7.0/highlight.min.js"><\/script>');
        }
        
        // 检查Mermaid是否加载成功
        if (typeof mermaid === 'undefined') {
            console.warn('Mermaid主CDN加载失败，尝试备用CDN');
            document.write('<script src="https://unpkg.com/mermaid@10.9.0/dist/mermaid.min.js"><\/script>');
        }

        // 检查KaTeX是否加载成功
        window.addEventListener('DOMContentLoaded', function() {
            if (typeof katex === 'undefined') {
                console.warn('KaTeX主CDN加载失败，尝试备用CDN');
                const katexCSS = document.createElement('link');
                katexCSS.rel = 'stylesheet';
                katexCSS.href = 'https://unpkg.com/katex@0.16.9/dist/katex.min.css';
                document.head.appendChild(katexCSS);
                
                const katexJS = document.createElement('script');
                katexJS.src = 'https://unpkg.com/katex@0.16.9/dist/katex.min.js';
                document.head.appendChild(katexJS);
                
                const autoRenderJS = document.createElement('script');
                autoRenderJS.src = 'https://unpkg.com/katex@0.16.9/dist/contrib/auto-render.min.js';
                document.head.appendChild(autoRenderJS);
            }
        });
    </script>
    
    <style>
        /* 加载动画 */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            flex-direction: column;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 1rem;
            color: var(--text-color);
            font-size: 0.9rem;
        }
        
        /* 错误提示样式 */
        .error-container {
            background-color: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
            margin: 1rem 0;
        }
        
        body.dark-mode .error-container {
            background-color: #2d1b1f;
            color: #f8d7da;
            border-color: #4a2c35;
        }
        
        /* Mermaid 图表容器 */
        .mermaid-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1.5rem 0;
            padding: 1.25rem;
            background: var(--bg-color, #fff);
            border: 1px solid var(--border-color, #e0e0e0);
            border-radius: 8px;
            overflow-x: auto;
        }

        body.dark-mode .mermaid-container {
            background: #1e1e2e;
            border-color: #3a3a4a;
        }

        .mermaid-container > .mermaid {
            width: 100%;
            min-width: 0;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mermaid-container svg {
            display: block;
            width: 100% !important;
            max-width: 100% !important;
            height: clamp(280px, 34vw, 460px) !important;
        }

        @media (max-width: 768px) {
            .mermaid-container {
                padding: 1rem;
            }

            .mermaid-container svg {
                height: clamp(240px, 60vw, 380px) !important;
            }
        }

        .svg-render-container {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0;
            padding: 1.25rem;
            background: var(--bg-color, #fff);
            border: 1px solid var(--border-color, #e0e0e0);
            border-radius: 8px;
            overflow-x: auto;
        }

        body.dark-mode .svg-render-container {
            background: #1e1e2e;
            border-color: #3a3a4a;
        }

        .svg-render-container svg {
            width: min(100%, 980px);
            max-width: none;
            height: auto;
        }

        .mermaid-error {
            color: #cc0000;
            padding: 0.5rem;
            font-size: 0.9rem;
        }

        /* Mermaid 全屏放大按钮 */
        .mermaid-fullscreen-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.25s, background-color 0.2s;
            z-index: 2;
        }

        .mermaid-container:hover .mermaid-fullscreen-btn {
            opacity: 1;
        }

        .mermaid-fullscreen-btn:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        body.dark-mode .mermaid-fullscreen-btn {
            background: rgba(255, 255, 255, 0.2);
        }

        body.dark-mode .mermaid-fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* Mermaid 全屏遮罩层 */
        .mermaid-fullscreen-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .mermaid-fullscreen-overlay.active {
            opacity: 1;
        }

        .mermaid-fullscreen-toolbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
            z-index: 10001;
            gap: 6px;
        }

        .mermaid-fullscreen-toolbar button {
            width: 34px;
            height: 34px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: background 0.2s;
            backdrop-filter: blur(4px);
        }

        .mermaid-fullscreen-toolbar button:hover {
            background: rgba(255,255,255,0.22);
        }

        .mermaid-fullscreen-toolbar .mermaid-zoom-info {
            color: rgba(255,255,255,0.65);
            font-size: 13px;
            min-width: 48px;
            text-align: center;
            user-select: none;
        }

        .mermaid-fullscreen-viewport {
            flex: 1;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }

        .mermaid-fullscreen-viewport:active {
            cursor: grabbing;
        }

        .mermaid-fullscreen-viewport svg {
            max-width: none !important;
            max-height: none !important;
            transform-origin: center center;
        }

        .mermaid-fullscreen-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.45);
            font-size: 12px;
            user-select: none;
            pointer-events: none;
            transition: opacity 0.6s;
        }

        /* 内联 SVG 响应式适配 */
        .markdown-content svg {
            max-width: 100%;
            height: auto;
        }

        /* 内容区域样式 */
        .markdown-container {
            min-height: 400px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>

    <!-- =========================================================
         新版文章阅读页主题
         融合样板：pages/article.html（布局与美术）
                  + pages/demo/newbottombackgroundbate.html（粒子背景）
         仅作用于本页，不影响站点其他页面
    ========================================================== -->
    <style id="mdx-new-theme">
        /* ---------- 1. 主题变量（日夜双套） ---------- */
        :root {
            --mdx-nav-h: 72px;
            --mdx-bg: #f4eee4;
            --mdx-text: #202832;
            --mdx-text-soft: #68717b;
            --mdx-text-muted: #939aa1;
            --mdx-accent: #5f88a7;
            --mdx-accent-soft: rgba(95, 136, 167, 0.12);
            --mdx-glass: rgba(255, 255, 255, 0.58);
            --mdx-glass-strong: rgba(255, 255, 255, 0.76);
            --mdx-border: rgba(70, 78, 86, 0.10);
            --mdx-shadow: 0 20px 60px rgba(56, 45, 32, 0.10);
            --mdx-card-bg: rgba(255, 255, 255, 0.22);
            --mdx-code-bg: #fbf8f0;

            /* 让沿用的旧组件跟随新配色 */
            --primary-color: #5f88a7;
            --text-color: #202832;
            --border-color: rgba(70, 78, 86, 0.10);
            --bg-color: #f4eee4;
            --card-background: rgba(255, 255, 255, 0.58);
        }

        body.dark-mode {
            --mdx-bg: #07172b;
            --mdx-text: #edf3fa;
            --mdx-text-soft: #aab8c8;
            --mdx-text-muted: #708196;
            --mdx-accent: #8bbbe2;
            --mdx-accent-soft: rgba(139, 187, 226, 0.12);
            --mdx-glass: rgba(15, 34, 57, 0.72);
            --mdx-glass-strong: rgba(20, 42, 68, 0.88);
            --mdx-border: rgba(190, 220, 245, 0.10);
            --mdx-shadow: 0 24px 70px rgba(0, 0, 0, 0.30);
            --mdx-card-bg: rgba(8, 24, 44, 0.18);
            --mdx-code-bg: rgba(4, 12, 24, 0.90);

            --primary-color: #8bbbe2;
            --text-color: #edf3fa;
            --border-color: rgba(190, 220, 245, 0.10);
            --bg-color: #07172b;
            --card-background: rgba(15, 34, 57, 0.72);
        }

        body {
            padding-top: 0; /* 覆盖 style.css 为旧固定导航预留的 70px */
            background: var(--mdx-bg);
            color: var(--mdx-text);
            transition:
                background 0.8s cubic-bezier(.16, 1, .3, 1),
                color 0.5s ease;
        }

        /* ---------- 2. 粒子画布与柔光层 ---------- */
        #particle-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        .mdx-ambient {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .mdx-ambient::before,
        .mdx-ambient::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.28;
            transition: background 1s ease, opacity 1s ease;
        }

        .mdx-ambient::before {
            width: 420px;
            height: 420px;
            top: -150px;
            left: -100px;
            background: #ead7b2;
        }

        .mdx-ambient::after {
            width: 500px;
            height: 500px;
            right: -180px;
            bottom: 0;
            background: #b7cee3;
        }

        body.dark-mode .mdx-ambient::before {
            background: #163b66;
            opacity: 0.35;
        }

        body.dark-mode .mdx-ambient::after {
            background: #0b426e;
            opacity: 0.28;
        }

        /* ---------- 3. 阅读进度条 ---------- */
        .mdx-reading-progress {

        .mdx-navbar {

        .mdx-language-switch.en .mdx-lang-slider {

        /* ---------- 7. 阅读区整体布局 ---------- */
        .md-article-layout.blog-post-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 150px 28px 40px;
            gap: 52px;
        }

        /*
            关键约束：弹性主列必须允许收缩到 0。
            图片的 max-width:100% 在 min-content 计算中按固有尺寸计入，
            没有 min-width:0 时，宽图（如 1280/1536px）会把主列撑出视口，
            导致整页出现横向滚动条。
        */
        .md-article-layout .blog-post-main {
            min-width: 0;
        }

        .md-article-layout .markdown-content img {
            max-width: 100%;
            height: auto;
        }

        .md-article-layout .blog-sidebar {
            width: 240px;
            top: 132px;
            max-height: calc(100vh - 160px);
        }

        .md-sidebar-drawer-btn {
            top: 150px;
            color: var(--mdx-accent);
        }

        /* ---------- 8. 目录（轻量阅读轨迹风格） ---------- */
        .md-article-layout .toc-container {
            border-left: 1px solid var(--mdx-border);
            padding-left: 16px;
        }

        .md-article-layout .toc-container h3 {
            padding: 0 8px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--mdx-text-muted);
        }

        .md-article-layout .toc-tree .toc-link {
            color: var(--mdx-text-muted);
            border-radius: 9px;
        }

        .md-article-layout .toc-tree .toc-link:hover {
            color: var(--mdx-text);
            background: var(--mdx-accent-soft);
            box-shadow: none;
            transform: translateX(2px);
        }

        .md-article-layout .toc-tree .toc-link.active {
            color: var(--mdx-text);
            background: var(--mdx-accent-soft);
            box-shadow: inset 3px 0 0 var(--mdx-accent);

        /** URL 或默认中的「逻辑路径」，用于 _zh/_en 配对；不随语言改写查询串 */
        let mdBaseFromUrl = '';
        let isFullscreen = false;
        let mdTocScrollTick = false;
        const MD_FONT_SIZE_KEY = 'md-article-font-size';
        const MD_FONT_SIZE_STEPS = ['normal', 'large', 'xlarge', 'small'];
        const MD_COMMENT_DRAFT_PREFIX = 'md-comment-draft:';
        const MD_COMMENT_LIST_PREFIX = 'md-comment-list:';
        const MD_COMMENT_COOLDOWN_MS = 8000;
        let mdCommentLastSubmitAt = 0;

        function getCurrentLang() {
            return document.body.classList.contains('en') ? 'en' : 'zh';
        }

        function normalizeMarkdownIdentity(path) {
            if (!path) return '';
            try {
                const url = new URL(path, window.location.href);
                return decodeURIComponent(url.pathname)
                    .replace(/\\/g, '/')
                    .toLowerCase()
                    .replace(/_(?:zh|en)((?:_\d+)?)\.md$/i, '$1.md');
            } catch (e) {
                return String(path)
                    .split('#')[0]
                    .split('?')[0]
                    .replace(/\\/g, '/')
                    .toLowerCase()
                    .replace(/_(?:zh|en)((?:_\d+)?)\.md$/i, '$1.md');
            }
        }

        function getPostMarkdownIdentity(post) {
            if (!post || !post.url) return '';
            try {
                const postUrl = new URL(post.url, window.location.href);
                const mdParam = postUrl.searchParams.get('md') || postUrl.searchParams.get('file');
                if (!mdParam) return '';
                return normalizeMarkdownIdentity(new URL(mdParam, new URL('./', postUrl)).href);
            } catch (e) {
                return '';
            }
        }

        function getArticleDataSources() {
            return [
                {
                    type: 'blog',
                    posts: Array.isArray(window.BLOG_POSTS_DATA) ? window.BLOG_POSTS_DATA : [],
                    backUrl: '../blog.html',
                    backZh: '返回博客列表',
                    backEn: 'Back to Blog'
                },
                {
                    type: 'game',
                    posts: Array.isArray(window.GAMEBLOG_POSTS_DATA) ? window.GAMEBLOG_POSTS_DATA : [],
                    backUrl: 'noval/gameblog.html',
                    backZh: '返回游戏博客',
                    backEn: 'Back to Game Blog'
                },
                {
                    type: 'travel',
                    posts: Array.isArray(window.TRAVELBLOG_POSTS_DATA) ? window.TRAVELBLOG_POSTS_DATA : [],
                    backUrl: 'noval/travelblog.html',
                    backZh: '返回旅行见闻',
                    backEn: 'Back to Travel Notes'
                }
            ];
        }

        function getCurrentArticlePost() {
            const sources = getArticleDataSources();

            const candidates = [
                currentMarkdownFile,
                mdBaseFromUrl,
                getMarkdownFileFromURL()
            ].map(normalizeMarkdownIdentity).filter(Boolean);

            for (const source of sources) {
                const post = source.posts.find(item => {
                    const postIdentity = getPostMarkdownIdentity(item);
                    return postIdentity && candidates.includes(postIdentity);
                });
                if (post) return { post, source };
            }
            return null;
        }

        function getCategoryLabel(category, lang) {
            const meta = typeof getBlogCategoryMeta === 'function'
                ? getBlogCategoryMeta(category)
                : (window.BLOG_CATEGORY_META && window.BLOG_CATEGORY_META[category]);
            if (!meta) return category || PAGE_CONFIG.articleMeta.category;
            return lang === 'en' ? (meta.en || meta.zh || category) : (meta.zh || meta.en || category);
        }

        function getResolvedArticleMeta() {
            const lang = getCurrentLang();
            const resolved = getCurrentArticlePost();
            if (!resolved) {
                return {
                    date: PAGE_CONFIG.articleMeta.date,
                    category: lang === 'en' ? PAGE_CONFIG.articleMeta.category_en : PAGE_CONFIG.articleMeta.category,
                    categoryZh: PAGE_CONFIG.articleMeta.category,
                    categoryEn: PAGE_CONFIG.articleMeta.category_en,
                    tags: lang === 'en' ? PAGE_CONFIG.articleMeta.tags_en : PAGE_CONFIG.articleMeta.tags,
                    backUrl: '../blog.html',
                    backZh: '返回博客列表',
                    backEn: 'Back to Blog'
                };
            }

            const post = resolved.post;
            const source = resolved.source;
            const categoryZh = post.category_zh || getCategoryLabel(post.category, 'zh');
            const categoryEn = post.category_en || getCategoryLabel(post.category, 'en');
            const tags = lang === 'en'
                ? (post.tags_en && post.tags_en.length ? post.tags_en : post.tags)
                : (post.tags && post.tags.length ? post.tags : post.tags_en);

            return {
                date: post.date || PAGE_CONFIG.articleMeta.date,
                category: lang === 'en' ? categoryEn : categoryZh,
                categoryZh,
                categoryEn,
                tags: tags && tags.length ? tags : (lang === 'en' ? PAGE_CONFIG.articleMeta.tags_en : PAGE_CONFIG.articleMeta.tags),
                backUrl: source.backUrl,
                backZh: source.backZh,
                backEn: source.backEn
            };
        }

        async function mdFileExists(url) {
            try {
                let r = await fetch(url, { method: 'HEAD', cache: 'no-cache' });
                if (r.ok) return true;
                r = await fetch(url, { cache: 'no-cache' });
                return r.ok;
            } catch (e) {
                return false;
            }
        }

        /**
         * 根据语言解析要加载的 md 路径：
         * - xxx_zh.md <-> xxx_en.md
         * - 无后缀对时：英文优先 xxx_en.md；中文优先 xxx_zh.md（存在才用），否则原文件
         */
        async function resolveMarkdownPathForLanguage(basePath, lang) {
            if (!basePath) return basePath;
            const zhNumPair = basePath.match(/^(.+)_zh(_\d+)\.md$/i);
            if (zhNumPair) {
                return lang === 'zh' ? basePath : zhNumPair[1] + '_en' + zhNumPair[2] + '.md';
            }
            const enNumPair = basePath.match(/^(.+)_en(_\d+)\.md$/i);
            if (enNumPair) {
                return lang === 'en' ? basePath : enNumPair[1] + '_zh' + enNumPair[2] + '.md';
            }
            const zhPair = basePath.match(/^(.+)_zh\.md$/i);
            if (zhPair) {
                return lang === 'zh' ? basePath : zhPair[1] + '_en.md';
            }
            const enPair = basePath.match(/^(.+)_en\.md$/i);
            if (enPair) {
                return lang === 'en' ? basePath : enPair[1] + '_zh.md';
            }
            if (lang === 'en') {
                const enTry = basePath.replace(/\.md$/i, '_en.md');
                if (enTry !== basePath && await mdFileExists(enTry)) return enTry;
                return basePath;
            }
            const zhTry = basePath.replace(/\.md$/i, '_zh.md');
            if (zhTry !== basePath && await mdFileExists(zhTry)) return zhTry;
            return basePath;
        }

        window.addEventListener('sitewide-language-change', async function() {
            if (!markdownRenderer || !mdBaseFromUrl) return;
            await loadAndRenderMarkdown();
            syncMdChromeI18n();
        });

        // 从URL参数获取Markdown文件路径
        function getMarkdownFileFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('md') || urlParams.get('file');
        }

        function syncMdChromeI18n() {
            const lang = getCurrentLang();
            document.querySelectorAll('.md-icon-action[data-zh-tooltip]').forEach(function (btn) {
                const t = btn.getAttribute(lang === 'en' ? 'data-en-tooltip' : 'data-zh-tooltip');
                if (t) btn.setAttribute('title', t);
            });
            const drawerBtn = document.getElementById('md-sidebar-drawer-btn');
            if (drawerBtn) {
                const collapsed = document.getElementById('md-article-layout').classList.contains('md-layout--sidebar-collapsed');
                const showZh = lang === 'zh';
                if (collapsed) {
                    drawerBtn.setAttribute('title', showZh ? '展开侧栏' : 'Show sidebar');
                } else {
                    const dt = drawerBtn.getAttribute(showZh ? 'data-zh-title' : 'data-en-title');
                    if (dt) drawerBtn.setAttribute('title', dt);
                }
            }
            syncFontSizeButtonLabel();
            syncCommentChromeI18n();
        }

        function closeMobileSidebar() {
            if (window.innerWidth > 992) return;
            const layout = document.getElementById('md-article-layout');
            const btn = document.getElementById('md-sidebar-drawer-btn');
            const backdrop = document.querySelector('.md-sidebar-backdrop');
            if (!layout || layout.classList.contains('md-layout--sidebar-collapsed')) return;
            layout.classList.add('md-layout--sidebar-collapsed');
            if (btn) {
                btn.classList.add('md-sidebar-drawer-btn--collapsed');
                btn.setAttribute('aria-expanded', 'false');
            }
            if (backdrop) backdrop.classList.remove('active');
            document.body.classList.remove('md-sidebar-open');
            const lang = getCurrentLang();
            if (btn) btn.setAttribute('title', lang === 'zh' ? '展开侧栏' : 'Show sidebar');
        }

        function initSidebarDrawer() {
            const layout = document.getElementById('md-article-layout');
            const btn = document.getElementById('md-sidebar-drawer-btn');
            if (!layout || !btn) return;

            var backdrop = document.querySelector('.md-sidebar-backdrop');
            if (!backdrop) {
                backdrop = document.createElement('div');
                backdrop.className = 'md-sidebar-backdrop';
                document.body.appendChild(backdrop);
            }

            if (window.innerWidth <= 992) {
                layout.classList.add('md-layout--sidebar-collapsed');
                btn.classList.add('md-sidebar-drawer-btn--collapsed');
                btn.setAttribute('aria-expanded', 'false');
            }

            btn.addEventListener('click', function () {
                const collapsed = layout.classList.toggle('md-layout--sidebar-collapsed');
                btn.classList.toggle('md-sidebar-drawer-btn--collapsed', collapsed);
                btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');

                if (window.innerWidth <= 992) {
                    backdrop.classList.toggle('active', !collapsed);
                    document.body.classList.toggle('md-sidebar-open', !collapsed);
                }

                const lang = getCurrentLang();
                if (collapsed) {
                    btn.setAttribute('title', lang === 'zh' ? '展开侧栏' : 'Show sidebar');
                } else {
                    syncMdChromeI18n();
                }
            });

            backdrop.addEventListener('click', closeMobileSidebar);
        }

        function initTocBranchToggles(root) {
            if (!root) return;
            root.querySelectorAll('.toc-branch-toggle').forEach(function (toggleBtn) {
                toggleBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const branch = toggleBtn.closest('.toc-branch');
                    if (!branch) return;
                    const open = branch.getAttribute('data-open') === 'true';
                    const next = !open;
                    branch.setAttribute('data-open', next ? 'true' : 'false');
                    toggleBtn.setAttribute('aria-expanded', next ? 'true' : 'false');
                    toggleBtn.classList.toggle('toc-branch-toggle--collapsed', !next);
                });
            });
        }

        // 页面初始化
        document.addEventListener('DOMContentLoaded', async function() {
            markdownRenderer = new MarkdownRenderer();
            mdBaseFromUrl = getMarkdownFileFromURL() || PAGE_CONFIG.defaultMarkdownFile;

            await loadAndRenderMarkdown();

            initPageFeatures();
            initSidebarDrawer();
            initArticleFontSizeControl();
            initLocalComments();
            initThemeToggle();
            syncMdChromeI18n();
        });

        async function loadAndRenderMarkdown() {
            try {
                showLoadingState();

                const lang = getCurrentLang();
                let path = await resolveMarkdownPathForLanguage(mdBaseFromUrl, lang);
                let markdownText;

                try {
                    markdownText = await markdownRenderer.loadMarkdownFile(path);
                    currentMarkdownFile = path;
                } catch (primaryErr) {
                    if (path !== mdBaseFromUrl) {
                        markdownText = await markdownRenderer.loadMarkdownFile(mdBaseFromUrl);
                        currentMarkdownFile = mdBaseFromUrl;
                    } else {
                        throw primaryErr;
                    }
                }

                const result = await markdownRenderer.renderMarkdown(
                    markdownText,
                    document.getElementById('markdown-content')
                );

                if (typeof window.setupLeisureMarkdownEnhancements === 'function') {
                    window.setupLeisureMarkdownEnhancements(document.getElementById('markdown-content'));
                }

                removeDuplicateRenderedTitle(markdownText);
                updateTableOfContents(result.toc);
                updatePageMetadata(markdownText);
                hideLoadingState();
                syncMdChromeI18n();

            } catch (error) {
                console.error('加载Markdown文件失败:', error);
                showErrorState(error.message);
            }
        }

        // 显示加载状态
        function showLoadingState() {
            const content = document.getElementById('markdown-content');
            const toc = document.getElementById('toc-content');
            
            content.innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <div class="loading-text" data-en="Loading article content..." data-zh="正在加载文章内容...">正在加载文章内容...</div>
                </div>
            `;
            
            toc.innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <div class="loading-text" data-en="Loading..." data-zh="加载中...">加载中...</div>
                </div>
            `;
        }

        // 隐藏加载状态
        function hideLoadingState() {
            // 加载状态会被实际内容替换，无需特殊处理
        }

        // 显示错误状态
        function showErrorState(errorMessage) {
            const content = document.getElementById('markdown-content');
            const currentLang = document.body.classList.contains('en') ? 'en' : 'zh';
            
            const errorText = currentLang === 'en' 
                ? `Failed to load article: ${errorMessage}` 
                : `加载文章失败：${errorMessage}`;
            
            content.innerHTML = `
                <div class="error-container">
                    <h3><i class="fas fa-exclamation-triangle"></i> ${currentLang === 'en' ? 'Error' : '错误'}</h3>
                    <p>${errorText}</p>
                    <p>${currentLang === 'en' ? 'Please check the file path or try again later.' : '请检查文件路径或稍后重试。'}</p>
                </div>
            `;
            
            // 更新目录为错误状态
            const toc = document.getElementById('toc-content');
            toc.innerHTML = `<p class="no-toc">${currentLang === 'en' ? 'Unable to load table of contents' : '无法加载目录'}</p>`;
        }

        function normalizeTitleText(text) {
            return String(text || '').replace(/\s+/g, ' ').trim();
        }

        function removeDuplicateRenderedTitle(markdownText) {
            const titleMatch = markdownText.match(/^#\s+(.+)$/m);
            if (!titleMatch) return;

            const content = document.getElementById('markdown-content');
            const firstHeading = content && content.querySelector('h1');
            if (!firstHeading) return;

            const markdownTitle = normalizeTitleText(titleMatch[1]);
            const renderedTitle = normalizeTitleText(firstHeading.textContent);
            if (!markdownTitle || markdownTitle !== renderedTitle) return;

            const anchorId = firstHeading.id;
            const header = document.querySelector('.post-header');
            if (anchorId && header) header.id = anchorId;
            firstHeading.remove();
        }

        // 更新目录
        function updateTableOfContents(tocItems) {
            const tocContent = document.getElementById('toc-content');
            
            if (!tocItems || tocItems.length === 0) {
                const currentLang = document.body.classList.contains('en') ? 'en' : 'zh';
                tocContent.innerHTML = `<p class="no-toc">${currentLang === 'en' ? 'No table of contents available' : '本文暂无目录'}</p>`;
                return;
            }
            
            tocContent.innerHTML = markdownRenderer.generateTOCHTML();

            initTocBranchToggles(tocContent);

            const tocLinks = tocContent.querySelectorAll('.toc-link');
            tocLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('href').substring(1);
                    const targetElement = document.getElementById(targetId);

                    if (targetElement) {
                        closeMobileSidebar();

                        targetElement.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });

                        tocLinks.forEach(l => l.classList.remove('active'));
                        this.classList.add('active');

                        history.pushState(null, null, this.getAttribute('href'));
                    }
                });
            });
        }

        // 更新页面元数据（正文语言由当前加载的 md 决定，标题取该文件首行 #）
        function updatePageMetadata(markdownText) {
            const titleMatch = markdownText.match(/^#\s+(.+)$/m);
            const extractedTitle = titleMatch ? titleMatch[1].trim() : null;
            const lang = getCurrentLang();
            const fallback = lang === 'en' ? PAGE_CONFIG.articleMeta.title_en : PAGE_CONFIG.articleMeta.title;
            const pageTitle = extractedTitle || fallback;
            const articleMeta = getResolvedArticleMeta();

            document.getElementById('page-title').textContent = `${pageTitle} - HealthJian的博客`;

            const titleEl = document.getElementById('article-title-text');
            if (titleEl) titleEl.textContent = pageTitle;
            
            // 更新日期
            document.getElementById('post-date').textContent = articleMeta.date;
            
            // 更新分类
            const categoryElement = document.getElementById('post-category');
            categoryElement.setAttribute('data-zh', articleMeta.categoryZh);
            categoryElement.setAttribute('data-en', articleMeta.categoryEn);
            categoryElement.textContent = articleMeta.category;
            
            // 更新标签
            const tagsContainer = document.getElementById('post-tags');
            const tags = articleMeta.tags;
            
            tagsContainer.innerHTML = '';
            tags.forEach(tag => {
                const tagElement = document.createElement('span');
                tagElement.className = 'tag';
                tagElement.textContent = tag;
                tagsContainer.appendChild(tagElement);
            });

            const backLink = document.getElementById('post-back-link');
            const backLabel = document.getElementById('post-back-label');
            if (backLink && backLabel) {
                backLink.href = articleMeta.backUrl;
                backLabel.setAttribute('data-zh', articleMeta.backZh);
                backLabel.setAttribute('data-en', articleMeta.backEn);
                backLabel.textContent = lang === 'en' ? articleMeta.backEn : articleMeta.backZh;
            }
        }

        // 初始化页面功能
        function initPageFeatures() {
            // 打印功能
            document.getElementById('print-btn').addEventListener('click', function() {
                window.print();
            });
            
            // 分享功能
            document.getElementById('share-btn').addEventListener('click', function() {

                    navigator.share({

        function normalizeArticleFontSize(size) {
            return MD_FONT_SIZE_STEPS.includes(size) ? size : 'normal';
        }

        function getArticleFontSizeLabel(size, lang) {
            const labels = {
                small: { zh: '小号', en: 'Small' },
                normal: { zh: '标准', en: 'Normal' },
                large: { zh: '较大', en: 'Large' },
                xlarge: { zh: '特大', en: 'Extra large' }
            };
            return labels[size][lang];
        }

        function applyArticleFontSize(size) {
            const layout = document.getElementById('md-article-layout');
            const nextSize = normalizeArticleFontSize(size);
            if (layout) layout.setAttribute('data-font-size', nextSize);
            try {
                localStorage.setItem(MD_FONT_SIZE_KEY, nextSize);
            } catch (e) {
                console.warn('字号偏好保存失败:', e);
            }
            syncFontSizeButtonLabel();
        }

        function syncFontSizeButtonLabel() {
            const btn = document.getElementById('font-size-btn');
            const layout = document.getElementById('md-article-layout');
            if (!btn || !layout) return;

            const lang = getCurrentLang();
            const size = normalizeArticleFontSize(layout.getAttribute('data-font-size'));
            const label = getArticleFontSizeLabel(size, lang);
            const prefix = lang === 'en' ? 'Font size' : '字号';
            btn.setAttribute('title', `${prefix}: ${label}`);
            btn.setAttribute('aria-label', `${prefix}: ${label}`);
        }

        function initArticleFontSizeControl() {
            const btn = document.getElementById('font-size-btn');
            const layout = document.getElementById('md-article-layout');
            if (!btn || !layout) return;

            let savedSize = 'normal';
            try {
                savedSize = localStorage.getItem(MD_FONT_SIZE_KEY) || 'normal';
            } catch (e) {
                savedSize = 'normal';
            }
            applyArticleFontSize(savedSize);

            btn.addEventListener('click', function () {
                const current = normalizeArticleFontSize(layout.getAttribute('data-font-size'));
                const nextIndex = (MD_FONT_SIZE_STEPS.indexOf(current) + 1) % MD_FONT_SIZE_STEPS.length;
                applyArticleFontSize(MD_FONT_SIZE_STEPS[nextIndex]);
            });
        }

        function getCommentStorageIdentity() {

        function readLocalComments() {
            try {
                const raw = localStorage.getItem(getCommentStorageKey(MD_COMMENT_LIST_PREFIX));
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function writeLocalComments(comments) {
            localStorage.setItem(getCommentStorageKey(MD_COMMENT_LIST_PREFIX), JSON.stringify(comments.slice(0, 20)));
        }

        function setCommentStatus(type, message) {
            const status = document.getElementById('md-comment-status');
            if (!status) return;
            status.className = `md-comment-status md-comment-status--${type}`;
            status.textContent = message;
        }

        function updateCommentCount() {
            return;
        }

        function renderLocalComments() {
            const list = document.getElementById('md-local-comments');
            const empty = document.getElementById('md-comments-empty');
            if (!list || !empty) return;

            const comments = readLocalComments();
            empty.style.display = comments.length ? 'none' : '';
            empty.textContent = getCommentCopy('none');
            list.innerHTML = '';

            comments.forEach(function (comment) {
                const item = document.createElement('article');
                item.className = 'md-local-comment';

                const meta = document.createElement('div');
                meta.className = 'md-local-comment__meta';
                const time = document.createElement('time');
                time.dateTime = comment.createdAt;
                time.textContent = new Date(comment.createdAt).toLocaleString(getCurrentLang() === 'en' ? 'en-US' : 'zh-CN');
                meta.appendChild(time);

                const body = document.createElement('p');
                body.textContent = comment.text;

                item.appendChild(meta);
                item.appendChild(body);
                list.appendChild(item);
            });
        }

        function syncCommentChromeI18n() {
            const input = document.getElementById('md-comment-input');
            const form = document.getElementById('md-comment-form');
            if (!form) return;
            if (input) {
                const placeholder = input.getAttribute(getCurrentLang() === 'en' ? 'data-en-placeholder' : 'data-zh-placeholder');
                if (placeholder) input.setAttribute('placeholder', placeholder);
            }
            const status = document.getElementById('md-comment-status');
            if (status && !status.className.includes('--error') && !status.className.includes('--success')) {
                status.textContent = getCommentCopy('draft');
            }
            renderLocalComments();
        }

        function initLocalComments() {
            const form = document.getElementById('md-comment-form');
            const input = document.getElementById('md-comment-input');
            if (!form || !input) return;

            const draftKey = getCommentStorageKey(MD_COMMENT_DRAFT_PREFIX);
            try {
                const draft = localStorage.getItem(draftKey);
                if (draft) {
                    input.value = draft;
                    setCommentStatus('info', getCommentCopy('restored'));
                }
            } catch (e) {
                setCommentStatus('error', getCommentCopy('failed'));
            }
            updateCommentCount();
            renderLocalComments();

            input.addEventListener('input', function () {
                updateCommentCount();
                try {
                    localStorage.setItem(draftKey, input.value);
                    setCommentStatus('info', getCommentCopy('draft'));
                } catch (e) {
                    setCommentStatus('error', getCommentCopy('failed'));
                }
            });

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                const text = input.value.trim();
                const now = Date.now();

                if (!text) {
                    setCommentStatus('error', getCommentCopy('empty'));
                    return;
                }
                if (now - mdCommentLastSubmitAt < MD_COMMENT_COOLDOWN_MS) {
                    setCommentStatus('error', getCommentCopy('cooldown'));
                    return;
                }

                try {
                    const comments = readLocalComments();
                    comments.unshift({
                        text,
                        createdAt: new Date().toISOString()
                    });
                    writeLocalComments(comments);
                    localStorage.removeItem(draftKey);
                    input.value = '';
                    mdCommentLastSubmitAt = now;
                    updateCommentCount();
                    renderLocalComments();
                    setCommentStatus('success', getCommentCopy('saved'));
                } catch (err) {
                    setCommentStatus('error', getCommentCopy('failed'));
                }
            });
        }

        // 切换全屏模式
        function toggleFullscreen() {
            const button = document.getElementById('fullscreen-btn');
            const icon = button.querySelector('i');
            
            if (!isFullscreen) {
                // 进入全屏
                document.documentElement.requestFullscreen();
                icon.className = 'fas fa-compress';
                isFullscreen = true;
            } else {
                // 退出全屏
                document.exitFullscreen();
                icon.className = 'fas fa-expand';
                isFullscreen = false;
            }
        }

        // 更新活动的目录项
        function updateActiveTocItem() {
            const headings = document.querySelectorAll('.markdown-content h1, .markdown-content h2, .markdown-content h3, .markdown-content h4, .markdown-content h5, .markdown-content h6');
            const tocLinks = document.querySelectorAll('.toc-link');
            
            let activeHeading = null;
            const scrollTop = window.pageYOffset;
            
            // 找到当前可见的标题
            headings.forEach(heading => {
                const rect = heading.getBoundingClientRect();
                if (rect.top <= 100) {
                    activeHeading = heading;
                }
            });
            
            // 更新目录活动状态
            let activeLink = null;
            tocLinks.forEach(link => {
                link.classList.remove('active');
                if (activeHeading && link.getAttribute('href') === `#${activeHeading.id}`) {
                    link.classList.add('active');
                    activeLink = link;
                }
            });

            if (activeLink) {
                const scrollArea = document.querySelector('.toc-scroll-area');
                if (scrollArea) {
                    const linkRect = activeLink.getBoundingClientRect();
                    const areaRect = scrollArea.getBoundingClientRect();
                    if (linkRect.top < areaRect.top || linkRect.bottom > areaRect.bottom) {
                        activeLink.scrollIntoView({ block: 'nearest' });
                    }
                }
            }
            
            mdTocScrollTick = false;
        }

        // 初始化主题切换监听
        function initThemeToggle() {
            const themeToggle = document.getElementById('theme-toggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', function() {
                    // 延迟执行以确保主题已切换
                    setTimeout(() => {

                    }, 100);
                });
            }
            
            // 初始化时设置正确的高亮主题
            updateHighlightTheme();
        }

        // 更新代码高亮主题
        function updateHighlightTheme() {
            const lightTheme = document.getElementById('hljs-light');
            const darkTheme = document.getElementById('hljs-dark');
            const isDarkMode = document.body.classList.contains('dark-mode');
            
            if (lightTheme && darkTheme) {
                lightTheme.disabled = isDarkMode;
                darkTheme.disabled = !isDarkMode;

        // 监听全屏变化

            if (!document.fullscreenElement) {
                const button = document.getElementById('fullscreen-btn');
                const icon = button.querySelector('i');
                icon.className = 'fas fa-expand';

    <!-- =========================================================
         新版背景：IP 粒子引擎（融合自 pages/demo/newbottombackgroundbate.html）
         + 新导航栏 主题/语言/阅读进度 联动
    ========================================================== -->
    <script>
    /* =========================================================
       PARTICLE IP ENGINE
       只需要修改这里：IP 图片路径（已放置于 pages/blog/7903.jpg）
    ========================================================= */
    const MDX_IP_IMAGE_SRC = "./7903.jpg";

    /* IP 的最大尺寸：它是背景里的彩蛋，而不是正文里的巨大插画 */
    const MDX_IP_MAX_WIDTH = 430;

    /* 粒子采样间距：数值越小粒子越多越清晰，开销越大（Desktop 5~7 / Mobile 8~11） */
    let MDX_IP_SAMPLE_STEP = 6;

    const MDX_PARTICLE_THEMES = {
        day: {
            bg: [247, 243, 235],
            particle: [165, 148, 126],
            line: [158, 143, 125],
            ip: [118, 108, 99],
            glow: [238, 204, 145],
            text: "#514a44"
        },
        night: {
            bg: [5, 18, 38],
            particle: [125, 180, 230],
            line: [90, 145, 205],
            ip: [172, 208, 238],
            glow: [80, 175, 255],
            text: "#9eacbd"
        }
    };

    function mdxLerp(a, b, t) {
        return a + (b - a) * t;
    }

    function mdxLerpColor(a, b, t) {
        return [
            Math.round(mdxLerp(a[0], b[0], t)),
            Math.round(mdxLerp(a[1], b[1], t)),
            Math.round(mdxLerp(a[2], b[2], t))
        ];
    }

    function mdxRgba(c, alpha) {
        return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + alpha + ")";
    }

    function mdxRandomRange(min, max) {
        return min + Math.random() * (max - min);
    }

    class MdxParticleSystem {
        constructor(canvas) {
            this.canvas = canvas;
            this.ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });

            /* 主题动画 */
            this.themeProgress = 0;
            this.targetTheme = 0;

            /*
                pointer 只产生局部扰动，不把粒子吸到 pointer。
                这正是防止「鼠标停住 → 全部粒子堆过去」的核心。
            */
            this.pointer = {
                x: -9999,
                y: -9999,
                lastX: -9999,
                lastY: -9999,
                vx: 0,
                vy: 0,
                active: false,
                radius: 130,
                lastMoveTime: 0
            };

            this.ipParticles = [];
            this.backgroundParticles = [];
            this.grid = new Map();

            /* DPR 限制：不让 4K / 高 DPI 手机把 Canvas 成本直接放大 */
            this.dpr = Math.min(window.devicePixelRatio || 1, 1.5);

            this.resize();
            this.initBackground();
            this.loadIP();
            this.bindEvents();
            this.animate();
        }

        resize() {
            this.width = window.innerWidth;
            this.height = window.innerHeight;

            this.canvas.width = Math.floor(this.width * this.dpr);
            this.canvas.height = Math.floor(this.height * this.dpr);
            this.canvas.style.width = this.width + "px";
            this.canvas.style.height = this.height + "px";

            this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

            /* 移动设备降低采样密度 */
            if (this.width < 600) {
                MDX_IP_SAMPLE_STEP = 9;
                this.pointer.radius = 90;
            } else if (this.width < 1000) {
                MDX_IP_SAMPLE_STEP = 7;
                this.pointer.radius = 110;
            } else {
                MDX_IP_SAMPLE_STEP = 6;
                this.pointer.radius = 130;
            }

            if (this.ipImage) {
                this.generateIPParticles();
            }
        }

        initBackground() {
            let count;
            if (this.width < 600) {
                count = 35;
            } else if (this.width < 1000) {
                count = 65;
            } else {
                count = 100;
            }

            this.backgroundParticles = [];

            for (let i = 0; i < count; i++) {
                this.backgroundParticles.push({
                    x: Math.random() * this.width,
                    y: Math.random() * this.height,
                    vx: mdxRandomRange(-0.16, 0.16),
                    vy: mdxRandomRange(-0.16, 0.16),
                    radius: mdxRandomRange(0.5, 1.25),
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        loadIP() {
            const image = new Image();
            image.onload = () => {
                this.ipImage = image;
                this.generateIPParticles();
            };
            image.onerror = () => {
                console.warn("IP image not found:", MDX_IP_IMAGE_SRC);
            };
            image.src = MDX_IP_IMAGE_SRC;
        }

        generateIPParticles() {
            if (!this.ipImage) {
                return;
            }

            const offscreen = document.createElement("canvas");
            const offCtx = offscreen.getContext("2d");

            /* 保持原图片比例 */
            const ratio = this.ipImage.height / this.ipImage.width;
            const targetWidth = Math.min(MDX_IP_MAX_WIDTH, this.width * 0.32);
            const targetHeight = targetWidth * ratio;

            offscreen.width = Math.floor(targetWidth);
            offscreen.height = Math.floor(targetHeight);

            offCtx.clearRect(0, 0, targetWidth, targetHeight);
            offCtx.drawImage(this.ipImage, 0, 0, targetWidth, targetHeight);

            const imageData = offCtx.getImageData(0, 0, targetWidth, targetHeight);
            const data = imageData.data;

            /* IP 放在页面右下/中下区域，不盖住正文 */
            const centerX = this.width * 0.79;
            const centerY = this.height * 0.69;

            /* 屏幕太窄时 IP 自动缩小 */
            let scale = 1;
            if (this.width < 700) {
                scale = 0.72;
            }

            const points = [];

            /* 图片采样 */
            for (let y = 0; y < targetHeight; y += MDX_IP_SAMPLE_STEP) {
                for (let x = 0; x < targetWidth; x += MDX_IP_SAMPLE_STEP) {
                    const index = (y * targetWidth + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    const a = data[index + 3];

                    /* 白色背景不生成粒子：越白越不生成 */
                    const brightness = r * 0.299 + g * 0.587 + b * 0.114;

                    if (a > 20 && brightness < 238) {
                        const px = centerX + (x - targetWidth / 2) * scale;
                        const py = centerY + (y - targetHeight / 2) * scale;
                        points.push({ tx: px, ty: py, color: [r, g, b] });
                    }
                }
            }

            /* 粒子太多时均匀抽样，保证性能上限 */
            const MAX_IP_PARTICLES = this.width < 600 ? 850 : 1500;

            if (points.length > MAX_IP_PARTICLES) {
                const step = points.length / MAX_IP_PARTICLES;
                const reduced = [];
                for (let i = 0; i < points.length; i += step) {
                    reduced.push(points[Math.floor(i)]);
                }
                points.length = 0;
                points.push(...reduced);
            }

            /* 建立粒子：初始从随机位置汇聚到 IP */
            this.ipParticles = points.map((point, index) => {
                const angle = Math.random() * Math.PI * 2;
                const distance = mdxRandomRange(100, Math.max(this.width, this.height) * 0.45);

                return {
                    x: centerX + Math.cos(angle) * distance,
                    y: centerY + Math.sin(angle) * distance,
                    tx: point.tx,
                    ty: point.ty,
                    vx: mdxRandomRange(-0.2, 0.2),
                    vy: mdxRandomRange(-0.2, 0.2),
                    radius: mdxRandomRange(0.45, 1.35),
                    color: point.color,
                    seed: Math.random() * 100,
                    index
                };
            });
        }

        bindEvents() {
            window.addEventListener("resize", () => {
                this.resize();
                this.initBackground();
            });

            window.addEventListener("pointermove", e => {
                const oldX = this.pointer.x;
                const oldY = this.pointer.y;

                this.pointer.x = e.clientX;
                this.pointer.y = e.clientY;

                /* 只在鼠标移动时记录速度；静止时 vx/vy 自动衰减到 0 */
                if (oldX > -1000) {
                    this.pointer.vx = e.clientX - oldX;
                    this.pointer.vy = e.clientY - oldY;
                }

                this.pointer.active = true;
                this.pointer.lastMoveTime = performance.now();
            });

            window.addEventListener("pointerleave", () => {
                this.pointer.active = false;
            });

            window.addEventListener("pointerdown", e => {
                this.pointer.x = e.clientX;
                this.pointer.y = e.clientY;
                this.pointer.active = true;
                /* 一次性爆发，而不是持续吸附 */
                this.createTouchPulse(e.clientX, e.clientY);
            });

            window.addEventListener("pointerup", () => {
                /* 不立即消失，给粒子留一点回归时间 */
                setTimeout(() => {
                    this.pointer.active = false;
                }, 450);
            });
        }

        createTouchPulse(x, y) {
            const radius = 170;
            for (const p of this.ipParticles) {
                const dx = p.x - x;
                const dy = p.y - y;
                const distance = Math.hypot(dx, dy);

                if (distance < radius && distance > 1) {
                    const force = 1 - distance / radius;
                    p.vx += dx / distance * force * 4;
                    p.vy += dy / distance * force * 4;
                }
            }
        }

        updateBackground() {
            for (const p of this.backgroundParticles) {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < -20 || p.x > this.width + 20) {
                    p.vx *= -1;
                }
                if (p.y < -20 || p.y > this.height + 20) {
                    p.vy *= -1;
                }
            }
        }

        updateIP() {
            /* pointer velocity 衰减：防止鼠标静止后粒子仍持续获得能量 */
            this.pointer.vx *= 0.86;
            this.pointer.vy *= 0.86;

            const pointerIsMoving =
                Math.abs(this.pointer.vx) + Math.abs(this.pointer.vy) > 0.15;

            for (const p of this.ipParticles) {
                /* 1. IP 自身的目标吸引力：每个粒子永远有回家的方向 */
                const dx = p.tx - p.x;
                const dy = p.ty - p.y;
                p.vx += dx * 0.0065;
                p.vy += dy * 0.0065;

                /* 2. 非常轻微的生命感 */
                const time = performance.now() * 0.0004;
                p.vx += Math.sin(time + p.seed) * 0.002;
                p.vy += Math.cos(time * 1.13 + p.seed) * 0.002;

                /* 3. 鼠标局部磁场 */
                if (this.pointer.active) {
                    const mdx = p.x - this.pointer.x;
                    const mdy = p.y - this.pointer.y;
                    const distance = Math.hypot(mdx, mdy);
                    const radius = this.pointer.radius;

                    if (distance < radius) {
                        const safeDistance = Math.max(distance, 1);
                        const force = 1 - distance / radius;

                        /* A. 柔性排斥（REPULSION 不是 attraction，避免粒子堆积崩坏） */
                        const repel = force * force * 0.85;
                        p.vx += mdx / safeDistance * repel;
                        p.vy += mdy / safeDistance * repel;

                        /* B. 切向力：流体般的旋转 */
                        const tangentX = -mdy / safeDistance;
                        const tangentY = mdx / safeDistance;
                        p.vx += tangentX * force * 0.18;
                        p.vy += tangentY * force * 0.18;

                        /* C. 鼠标运动拖尾：只在 pointer 移动时注入 */
                        if (pointerIsMoving) {
                            const speed = Math.min(
                                Math.hypot(this.pointer.vx, this.pointer.vy),
                                30
                            );
                            const trail = force * speed * 0.012;
                            p.vx += this.pointer.vx * trail;
                            p.vy += this.pointer.vy * trail;
                        }
                    }
                }

                /* 4. 速度限制 */
                const speed = Math.hypot(p.vx, p.vy);
                const maxSpeed = 3.8;
                if (speed > maxSpeed) {
                    p.vx = p.vx / speed * maxSpeed;
                    p.vy = p.vy / speed * maxSpeed;
                }

                /* 5. 阻尼 */
                p.vx *= 0.92;
                p.vy *= 0.92;

                /* 6. 移动 */
                p.x += p.vx;
                p.y += p.vy;
            }
        }

        drawBackgroundNetwork(particleColor, lineColor) {
            const particles = this.backgroundParticles;
            const radius = 115;

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                for (let j = i + 1; j < particles.length; j++) {
                    const q = particles[j];
                    const dx = p.x - q.x;
                    const dy = p.y - q.y;
                    const distance = Math.hypot(dx, dy);

                    if (distance < radius) {
                        const alpha = (1 - distance / radius) * 0.075;
                        this.ctx.beginPath();
                        this.ctx.moveTo(p.x, p.y);
                        this.ctx.lineTo(q.x, q.y);
                        this.ctx.strokeStyle = mdxRgba(lineColor, alpha);
                        this.ctx.lineWidth = 0.65;
                        this.ctx.stroke();
                    }
                }
            }
        }

        drawIPNetwork(lineColor) {
            /* IP 粒子只在很小距离内连线，保持「粒子图」的感觉 */
            const radius = 34;

            /* 空间网格，避免 O(n²) */
            this.grid.clear();

            for (const p of this.ipParticles) {
                const gx = Math.floor(p.x / radius);
                const gy = Math.floor(p.y / radius);
                const key = gx + "," + gy;
                if (!this.grid.has(key)) {
                    this.grid.set(key, []);
                }
                this.grid.get(key).push(p);
            }

            for (const p of this.ipParticles) {
                const gx = Math.floor(p.x / radius);
                const gy = Math.floor(p.y / radius);

                for (let ox = -1; ox <= 1; ox++) {
                    for (let oy = -1; oy <= 1; oy++) {
                        const list = this.grid.get((gx + ox) + "," + (gy + oy));
                        if (!list) {
                            continue;
                        }
                        for (const q of list) {
                            if (q.index <= p.index) {
                                continue;
                            }
                            const dx = p.x - q.x;
                            const dy = p.y - q.y;
                            const distance = Math.hypot(dx, dy);

                            if (distance < radius) {
                                const alpha = (1 - distance / radius) * 0.12;
                                this.ctx.beginPath();
                                this.ctx.moveTo(p.x, p.y);
                                this.ctx.lineTo(q.x, q.y);
                                this.ctx.strokeStyle = mdxRgba(lineColor, alpha);
                                this.ctx.lineWidth = 0.55;
                                this.ctx.stroke();
                            }
                        }
                    }
                }
            }
        }

        drawParticles(themeProgress) {
            /* 背景粒子 */
            const backgroundColor = mdxLerpColor(
                MDX_PARTICLE_THEMES.day.particle,
                MDX_PARTICLE_THEMES.night.particle,
                themeProgress
            );

            for (const p of this.backgroundParticles) {
                this.ctx.beginPath();
                this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                this.ctx.fillStyle = mdxRgba(backgroundColor, 0.35 + themeProgress * 0.15);
                this.ctx.fill();
            }

            /* IP 粒子 */
            for (const p of this.ipParticles) {
                /* 原图颜色与主题颜色混合：白天原图更明显，夜间向蓝白融合 */
                const ipColor = mdxLerpColor(
                    p.color,
                    MDX_PARTICLE_THEMES.night.ip,
                    themeProgress * 0.72
                );

                /* IP 不要太亮：「发现以后才意识到它在那里」 */
                let alpha = 0.18 + themeProgress * 0.14;

                /* 鼠标附近增强，互动时更容易看见 */
                if (this.pointer.active) {
                    const dx = p.x - this.pointer.x;
                    const dy = p.y - this.pointer.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance < this.pointer.radius) {
                        const force = 1 - distance / this.pointer.radius;
                        alpha += force * 0.22;
                    }
                }

                this.ctx.beginPath();
                this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                this.ctx.fillStyle = mdxRgba(ipColor, alpha);
                this.ctx.fill();

                /* 夜间小粒子 glow，只给很少一部分 */
                if (themeProgress > 0.5 && p.radius > 1.05 && p.index % 13 === 0) {
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius * 2.8, 0, Math.PI * 2);
                    this.ctx.fillStyle = mdxRgba(
                        MDX_PARTICLE_THEMES.night.glow,
                        0.035 * themeProgress
                    );
                    this.ctx.fill();
                }
            }
        }

        draw() {
            /* Theme interpolation */
            this.themeProgress += (this.targetTheme - this.themeProgress) * 0.035;

            const bg = mdxLerpColor(
                MDX_PARTICLE_THEMES.day.bg,
                MDX_PARTICLE_THEMES.night.bg,
                this.themeProgress
            );
            const particleColor = mdxLerpColor(
                MDX_PARTICLE_THEMES.day.particle,
                MDX_PARTICLE_THEMES.night.particle,
                this.themeProgress
            );
            const lineColor = mdxLerpColor(
                MDX_PARTICLE_THEMES.day.line,
                MDX_PARTICLE_THEMES.night.line,
                this.themeProgress
            );

            /* 背景 */
            this.ctx.fillStyle = mdxRgba(bg, 1);
            this.ctx.fillRect(0, 0, this.width, this.height);

            /* 极其轻微的中心光晕 */
            const gradient = this.ctx.createRadialGradient(
                this.width * 0.52, this.height * 0.45, 0,
                this.width * 0.52, this.height * 0.45,
                Math.max(this.width, this.height) * 0.65
            );
            gradient.addColorStop(0, mdxRgba(
                this.themeProgress > 0.5 ? [80, 130, 190] : [255, 250, 240],
                this.themeProgress > 0.5 ? 0.055 : 0.20
            ));
            gradient.addColorStop(1, mdxRgba(bg, 0));
            this.ctx.fillStyle = gradient;
            this.ctx.fillRect(0, 0, this.width, this.height);

            this.drawBackgroundNetwork(particleColor, lineColor);
            this.drawIPNetwork(lineColor);
            this.drawParticles(this.themeProgress);
        }

        animate() {
            this.updateBackground();
            this.updateIP();
            this.draw();
            requestAnimationFrame(() => this.animate());
        }
    }

    /* =========================================================
       INITIALIZATION + 与站点主题/语言机制联动
    ========================================================= */
    document.addEventListener("DOMContentLoaded", function () {
        var canvas = document.getElementById("particle-canvas");
        var particleSystem = null;
        if (canvas) {
            try {
                particleSystem = new MdxParticleSystem(canvas);
            } catch (e) {
                console.warn("粒子背景初始化失败:", e);
            }
        }

        /* ---------- 日夜切换（复用站点 theme 约定：body.light-mode / dark-mode + localStorage） ---------- */
        var themeSwitch = document.getElementById("mdx-theme-switch");

        function syncMdxThemeUI() {
            var isDark = document.body.classList.contains("dark-mode");
            if (themeSwitch) {
                themeSwitch.querySelectorAll(".mdx-theme-option").forEach(function (btn) {
                    btn.classList.toggle("active", (btn.getAttribute("data-theme") === "night") === isDark);
                });
            }
            if (particleSystem) {
                particleSystem.targetTheme = isDark ? 1 : 0;
            }
        }

        if (themeSwitch) {
            themeSwitch.querySelectorAll(".mdx-theme-option").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var nextDark = btn.getAttribute("data-theme") === "night";
                    var isDark = document.body.classList.contains("dark-mode");
                    if (nextDark === isDark) {
                        syncMdxThemeUI();
                        return;
                    }
                    document.body.classList.remove("light-mode", "dark-mode");
                    document.body.classList.add(nextDark ? "dark-mode" : "light-mode");
                    try {
                        localStorage.setItem("theme", nextDark ? "dark-mode" : "light-mode");
                    } catch (e) {}
                    if (typeof updateHighlightTheme === "function") {
                        updateHighlightTheme();
                    }
                    syncMdxThemeUI();
                });
            });
        }

        /* ---------- 语言切换（复用 language.js 的全局机制） ---------- */
        var langSwitch = document.getElementById("mdx-language-switch");

        function syncMdxLangUI() {
            if (!langSwitch) return;
            var isEn = document.body.classList.contains("en");
            langSwitch.classList.toggle("en", isEn);
            langSwitch.querySelectorAll(".mdx-lang-btn").forEach(function (btn) {
                btn.classList.toggle("active", (btn.getAttribute("data-lang") === "en") === isEn);
            });
        }

        if (langSwitch) {
            langSwitch.querySelectorAll(".mdx-lang-btn").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var newLang = btn.getAttribute("data-lang");
                    var currentLang = document.body.classList.contains("en") ? "en" : "zh";
                    if (newLang === currentLang) {
                        syncMdxLangUI();
                        return;
                    }
                    document.body.classList.remove(currentLang);
                    document.body.classList.add(newLang);
                    document.documentElement.setAttribute("lang", newLang);
                    if (typeof updateAllLanguageElements === "function") {
                        updateAllLanguageElements(newLang);
                    }
                    try {
                        localStorage.setItem("language", newLang);
                    } catch (e) {}
                    window.dispatchEvent(new CustomEvent("sitewide-language-change", { detail: { lang: newLang } }));
                    syncMdxLangUI();
                });
            });
        }

        /* ---------- 初始同步（theme.js / language.js 的 DOMContentLoaded 先于本脚本执行） ---------- */
        syncMdxThemeUI();
        syncMdxLangUI();
        window.addEventListener("sitewide-language-change", syncMdxLangUI);

        /* body class 变化时同步粒子主题（如系统其他脚本切换主题） */
        try {
            new MutationObserver(function () {
                syncMdxThemeUI();
            }).observe(document.body, { attributes: true, attributeFilter: ["class"] });
        } catch (e) {}

        /* ---------- 阅读进度条 ---------- */
        var progressBar = document.getElementById("mdx-progress-bar");
        if (progressBar) {
            window.addEventListener("scroll", function () {
                var max = document.documentElement.scrollHeight - window.innerHeight;
                var progress = max > 0 ? (window.scrollY / max) * 100 : 0;
                progressBar.style.width = progress + "%";
            }, { passive: true });
        }
    });
    </script>
</body>
</html>
